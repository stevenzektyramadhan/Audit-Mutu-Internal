# ==============================================================================
# Nginx Server Block Configuration for Audit Mutu Internal (Production)
# ==============================================================================
# Place in: /etc/nginx/sites-available/ami.conf
# Symlink:  ln -s /etc/nginx/sites-available/ami.conf /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
# ==============================================================================

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ami.unmuhbabel.ac.id; # Ganti dengan domain production Anda

    # Let's Encrypt / ACME challenge allow
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request-uri;
    }
}

# Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ami.unmuhbabel.ac.id; # Ganti dengan domain production Anda

    # Document Root (harus menunjuk ke folder tempat index.php berada)
    root /var/www/html;
    index index.php index.html;

    # SSL TLS Configurations
    ssl_certificate /etc/letsencrypt/live/ami.unmuhbabel.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ami.unmuhbabel.ac.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum Upload and Client Buffer (Sinkronkan dengan php.ini upload_max_filesize dan post_max_size)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # 1. Block access to hidden files and directories (kecuali .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 2. Prevent PHP and script execution in uploads, assets, or static folders
    location ~* ^/(uploads|assets)/.*(\.php[0-9]?|\.phtml|\.phar|\.sh|\.cgi|\.pl|\.py)$ {
        deny all;
        return 403;
    }

    # 3. Block access to private storage categories under legacy uploads
    location ~* ^/uploads/(bukti_auditor|instrumen|penetapan|audit_evidence|ppepp_documents|user_photos|spmi_source|rtm_photos)/ {
        deny all;
        return 404;
    }

    # 4. Block access to sensitive application directories
    location ~ ^/(application|system|migrations|tests|backups|\.git|\.multibrain|\.omo|\.opencode|docker)/ {
        deny all;
        return 404;
    }

    # 5. Block access to sensitive root repository files and manifests
    location ~* \.(sql|md|lock|json|yaml|yml|env.*|ini|log|sh|bash)$ {
        deny all;
        return 404;
    }

    # 6. External public logo storage: image allowlist only.
    # Do not change this to `location ^~ /uploads/profil/`; ^~ skips the
    # executable-file regex above. Keep this regex after rule 2.
    location ~* ^/uploads/profil/([A-Za-z0-9][A-Za-z0-9._-]*\.(?:gif|jpe?g|png))$ {
        alias /var/ami-storage/public_uploads/profil/$1;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Deny directory listing, unknown extensions, and malformed logo paths.
    location /uploads/profil/ {
        return 404;
    }

    # 7. Static Assets caching and direct serving (hanya file non-eksekusi)
    location ~* ^/(assets|uploads/profil)/.*\.(ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # 8. CodeIgniter 3 Routing: Check physical file, otherwise route to index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 9. PHP-FPM FastCGI Handler (Strictly only for index.php)
    location = /index.php {
        limit_except GET POST {
            deny all;
        }

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Sesuaikan dengan socket PHP-FPM 8.3 pada server Anda
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # FastCGI Timeouts and Buffers
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # 10. Deny direct execution of any other .php file
    location ~ \.php$ {
        deny all;
        return 404;
    }
}
