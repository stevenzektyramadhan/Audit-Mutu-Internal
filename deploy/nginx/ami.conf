# Template Nginx production AlmaLinux. Salin ke /etc/nginx/conf.d/ami.conf,
# lalu ganti seluruh [GANTI_OLEH_TIM_IT] pada SALINAN server, bukan pada Git.
server {
    listen 80;
    listen [::]:80;
    server_name [GANTI_OLEH_TIM_IT_DOMAIN];

    location ^~ /.well-known/acme-challenge/ {
        root [GANTI_OLEH_TIM_IT_ACME_WEBROOT];
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Untuk nginx >= 1.25.1, tambahkan: http2 on;
    # Untuk nginx lebih lama, gunakan: listen 443 ssl http2;
    server_name [GANTI_OLEH_TIM_IT_DOMAIN];
    root [GANTI_OLEH_TIM_IT_RELEASE_ROOT];
    index index.php;

    ssl_certificate [GANTI_OLEH_TIM_IT_CERTIFICATE_PATH];
    ssl_certificate_key [GANTI_OLEH_TIM_IT_CERTIFICATE_KEY_PATH];
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25M;

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~* ^/(uploads|assets)/.*(\.php[0-9]?|\.phtml|\.phar|\.sh|\.cgi|\.pl|\.py)$ { return 403; }
    location ~* ^/uploads/(bukti_auditor|instrumen|penetapan|audit_evidence|ppepp_documents|user_photos|spmi_source|rtm_photos|tmp)/ { return 404; }
    location ~ ^/(application|system|migrations|tests|backups|vendor|\.git|\.multibrain|\.omo|\.opencode|docker|deploy|docs|scripts)/ { return 404; }
    location ~* \.(sql|md|lock|json|yaml|yml|env.*|ini|log|sh|bash)$ { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|Dockerfile|compose\.yaml)$ { return 404; }

    location ~* ^/uploads/profil/([A-Za-z0-9][A-Za-z0-9._-]*\.(?:gif|jpe?g|png|webp))$ {
        alias [GANTI_OLEH_TIM_IT_PUBLIC_UPLOADS_PATH]/profil/$1;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    location /uploads/profil/ { return 404; }

    location / { try_files $uri $uri/ /index.php$is_args$args; }

    # Hanya front controller ini yang dapat dieksekusi, termasuk PATH_INFO CI3.
    location = /index.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO '';
        fastcgi_param CI_ENV production;
        fastcgi_pass unix:/run/php-fpm/ami.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ ^/index\.php/ {
        fastcgi_split_path_info ^(/index\.php)(/.*)$;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param CI_ENV production;
        fastcgi_pass unix:/run/php-fpm/ami.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php(?:/|$) { return 404; }
}
