# Template sementara untuk menerbitkan sertifikat ACME. Salin ke
# /etc/nginx/conf.d/ami.conf hanya sebelum sertifikat tersedia.
server {
    listen 80;
    listen [::]:80;
    server_name [GANTI_OLEH_TIM_IT_DOMAIN];

    location ^~ /.well-known/acme-challenge/ {
        root [GANTI_OLEH_TIM_IT_ACME_WEBROOT];
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
