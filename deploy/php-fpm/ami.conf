; Template pool PHP-FPM 8.3 untuk AlmaLinux. Salin ke /etc/php-fpm.d/ami.conf,
; lalu simpan root:root 0644. Secret hanya berada pada /etc/ami/production.php.
; Direktori /etc/ami harus root:ami 0750 dan file secret root:ami 0640.
[ami]
user = ami
group = ami
listen = /run/php-fpm/ami.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

clear_env = yes
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500

php_admin_value[session.save_path] = /var/lib/ami/sessions
php_admin_value[upload_tmp_dir] = /var/lib/ami/private/tmp
php_admin_value[sys_temp_dir] = /var/lib/ami/private/tmp
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off

; Tidak ada password, key, atau path secret di FPM. Kedua nilai ini bukan secret.
env[CI_ENV] = production
env[APP_PRODUCTION_CONFIG_FILE] = /etc/ami/production.php
